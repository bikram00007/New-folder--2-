<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Birthday Surprise 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Caveat:wght@500;700&family=Poppins:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{--orange:#cf6f55;--red:#a94b54;--cream:#fffaf5;--ink:#35272d;--blush:#f2d9d6;--gold:#c49a58;--marker:'Caveat',cursive;--hand:'Caveat',cursive;--sans:'Poppins',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:var(--sans);color:var(--ink)}
  body{background:
    radial-gradient(circle at 15% 12%,rgba(196,154,88,.13) 0 1px,transparent 2px) 0 0/24px 24px,
    linear-gradient(rgba(255,250,245,.38),rgba(255,250,245,.48)),
    url("birthday-background.jpeg") center/cover fixed no-repeat}
  body::before,body::after{content:"";position:fixed;width:22rem;height:22rem;border-radius:50%;filter:blur(5px);pointer-events:none;opacity:.42}
  body::before{left:-10rem;top:-11rem;background:rgba(235,190,181,.7)}
  body::after{right:-12rem;bottom:-12rem;background:rgba(196,154,88,.18)}
  .scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;
    opacity:0;pointer-events:none;transform:translateY(18px) scale(.985);transition:opacity .65s ease,transform .65s cubic-bezier(.22,.8,.3,1);overflow-y:auto}
  .scene.active{opacity:1;pointer-events:auto;transform:none}
  .big{font-family:var(--marker);color:var(--red);font-size:clamp(3rem,12vw,5.2rem);font-weight:700;line-height:.9;letter-spacing:.02em;text-wrap:balance;text-shadow:0 2px 0 rgba(255,255,255,.9),0 12px 28px rgba(115,65,70,.12)}
  .hand{font-family:var(--hand);font-size:1.6rem;font-weight:700}
  .btn{border:1px solid rgba(255,255,255,.45);cursor:pointer;font:700 1.05rem var(--sans);letter-spacing:.03em;color:#fff;background:linear-gradient(135deg,#c66e67,#9b3f4b);padding:13px 30px;border-radius:999px;
    box-shadow:0 8px 22px rgba(169,75,84,.22),inset 0 1px rgba(255,255,255,.28);margin-top:22px;transition:transform .18s ease,box-shadow .18s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(169,75,84,.28),inset 0 1px rgba(255,255,255,.28)}
  .btn:active{transform:translateY(1px);box-shadow:0 5px 14px rgba(169,75,84,.22)}
  /* mascot (original doodle) */
  .mascot{width:120px;height:120px}
  /* ---------- 0 lock ---------- */
  #s0{background:linear-gradient(145deg,rgba(252,247,243,.7),rgba(244,225,222,.76));color:var(--ink);backdrop-filter:blur(2px)}
  #s0::after{content:"";position:absolute;inset:18px;border:1px solid rgba(196,154,88,.35);border-radius:28px;pointer-events:none}
  .heartframe{width:146px;height:146px;border-radius:50%;background:rgba(255,255,255,.88);border:1px solid rgba(196,154,88,.32);box-shadow:0 18px 45px rgba(93,56,67,.16),inset 0 0 0 9px rgba(242,217,214,.58);display:flex;align-items:center;justify-content:center}
  #s0 .title{color:var(--ink);font:700 1.05rem var(--sans);letter-spacing:.12em;text-transform:uppercase;margin:18px 0 12px}
  #code{display:flex;gap:12px;margin-bottom:16px}
  #code i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--orange);transition:.2s}
  #code i.f{background:var(--orange);box-shadow:0 0 0 4px rgba(207,111,85,.11)}
  .pad{display:grid;grid-template-columns:repeat(3,68px);gap:9px;padding:9px;background:rgba(255,255,255,.48);border:1px solid rgba(196,154,88,.18);border-radius:22px;box-shadow:0 16px 40px rgba(93,56,67,.12);backdrop-filter:blur(10px)}
  .pad button{height:50px;border-radius:14px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.92);font:600 1.1rem var(--sans);color:var(--ink);cursor:pointer;box-shadow:0 4px 10px rgba(93,56,67,.08);transition:.15s}
  .pad button:active{transform:translateY(3px);box-shadow:none}
  .hint{margin-top:16px;color:var(--red);font:700 1.3rem var(--hand);opacity:.95}
  /* wrong overlay */
  #wrong{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--cream)}
  #wrong.show{display:flex;animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .x{font-size:3rem;color:#2b7de9}
  /* ---------- 1 quiz ---------- */
  .row{display:flex;gap:16px;margin-top:10px;justify-content:center}
  .row .btn{margin-top:14px;min-width:110px;padding:12px 18px}
  /* ---------- 2 hbd ---------- */
  .photo-tape{position:relative;background:#fff;padding:11px 11px 38px;box-shadow:0 24px 50px rgba(93,56,67,.22);transform:rotate(-2deg);margin:20px 0 10px;width:min(68vw,260px);border:1px solid rgba(196,154,88,.18)}
  .photo-tape::before{content:"";position:absolute;top:-12px;left:50%;width:80px;height:24px;margin-left:-40px;background:rgba(255,214,102,.8);transform:rotate(3deg)}
  .ph{aspect-ratio:1;background:center/cover no-repeat;background-color:#eadbd6;display:flex;align-items:center;justify-content:center;font-size:3rem}
  .balloons span{position:fixed;bottom:-60px;font-size:2.4rem;animation:up 7s linear infinite;pointer-events:none}
  @keyframes up{to{transform:translateY(-120vh)}}
  /* ---------- 3 gifts ---------- */
  .gifts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
  .gift{font-size:4.2rem;cursor:pointer;transition:transform .2s,filter .2s;filter:drop-shadow(0 12px 12px rgba(93,56,67,.18));text-shadow:0 2px 0 #fff}
  .gift:hover{transform:translateY(-5px) rotate(-2deg)}
  .gift:active{transform:scale(.9) rotate(-6deg)}
  .gift.done{opacity:.4;filter:grayscale(.6)}
  #modal{position:fixed;inset:0;z-index:30;background:rgba(40,10,5,.65);display:none;align-items:center;justify-content:center;padding:24px}
  #modal.show{display:flex}
  #modal .card{background:rgba(255,250,245,.96);border:1px solid rgba(196,154,88,.45);border-radius:24px;padding:26px;max-width:360px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(53,39,45,.34);animation:pop .35s;backdrop-filter:blur(16px)}
  @keyframes pop{from{transform:scale(.5);opacity:0}}
  #modal .card .ph{border-radius:10px;margin-bottom:12px;font-size:4rem}
  /* ---------- 4 memories ---------- */
  .line{position:relative;width:100%;max-width:440px;margin-top:20px}
  .line::before{content:"";position:absolute;left:0;right:0;top:10px;height:3px;background:#8a5a44;border-radius:3px}
  .pegs{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 10px;padding-top:2px}
  .polaroid{position:relative;width:96px;background:#fff;padding:6px 6px 24px;border:1px solid rgba(196,154,88,.22);box-shadow:0 16px 28px rgba(93,56,67,.18);cursor:pointer;margin-top:14px;transition:transform .25s ease}
  .polaroid:nth-child(odd){transform:rotate(-4deg)}.polaroid:nth-child(even){transform:rotate(4deg)}
  .polaroid:active{transform:scale(1.15)}
  .polaroid::before{content:"";position:absolute;top:-16px;left:50%;width:10px;height:24px;background:#e5a14a;margin-left:-5px;border-radius:2px}
  .polaroid .ph{font-size:1.8rem}
  /* ---------- 5 letter ---------- */
  .paper{width:min(92vw,430px);max-height:62vh;overflow-y:auto;background:#fffdf9;border-radius:10px;padding:28px 28px 18px 46px;text-align:left;
    font:700 1.45rem/32px var(--hand);box-shadow:0 24px 55px rgba(93,56,67,.16);
    background-image:repeating-linear-gradient(transparent 0 31px,#cfe3f5 31px 32px);border-left:3px solid #f2a1a1;position:relative}
  .paper p{margin-bottom:32px}
  .paper .sig{text-align:right;color:var(--red)}
  /* ---------- 6 slides ---------- */
  .slide{width:min(80vw,310px);margin-top:14px;background:#fff;padding:10px;border:1px solid rgba(196,154,88,.35);border-radius:12px;box-shadow:0 28px 60px rgba(93,56,67,.22)}
  .slide .ph{aspect-ratio:4/5}
  .nav{display:flex;gap:18px;align-items:center;justify-content:center;margin-top:10px}
  .nav button{background:none;border:0;font-size:2rem;cursor:pointer;color:var(--red)}
  .nav button:disabled{opacity:.25}
  /* ---------- 7 collage ---------- */
  .collage{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:min(92vw,400px);margin-top:18px;padding:9px;background:rgba(169,75,84,.92);border:1px solid rgba(196,154,88,.5);border-radius:14px;box-shadow:0 28px 58px rgba(93,56,67,.22)}
  .collage .ph{aspect-ratio:1;font-size:1.6rem;border-radius:4px;opacity:0;animation:fadeIn .6s forwards}
  @keyframes fadeIn{to{opacity:1}}
  .video-player{width:min(88vw,760px);max-height:58vh;margin-top:18px;border:1px solid rgba(196,154,88,.45);border-radius:16px;background:#1f1719;box-shadow:0 24px 55px rgba(93,56,67,.22)}
  #videoStatus{min-height:1.5em;margin-top:10px;color:var(--red)}
  .video-nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .video-nav .btn{margin-top:8px}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
  #mute{position:fixed;top:12px;right:12px;z-index:50;border:0;border-radius:50%;width:40px;height:40px;background:rgba(255,255,255,.85);cursor:pointer;display:none}
  button:focus-visible,[role="button"]:focus-visible{outline:3px solid #fff;outline-offset:3px}
  #modal .card{position:relative}
  #modalClose{position:absolute;top:-16px;right:-16px;width:38px;height:38px;padding:0;margin:0;border-radius:50%;font:700 1.3rem var(--sans);box-shadow:0 3px 0 #8e1d12}
  #wrong button:focus-visible{outline-color:#4a1d12}
  #passcodeStatus{position:absolute;clip:rect(0 0 0 0);clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<button id="mute">🔊</button>
<div class="balloons" id="balloons"></div>

<!-- WRONG PASSCODE -->
<div id="wrong">
  <div class="big">WRONG<br>PASSCODE</div>
  <div class="x">✖</div>
  <svg class="mascot" viewBox="0 0 120 120"><use href="#mascot"/></svg>
  <button class="btn" onclick="$('#wrong').classList.remove('show')">TRY AGAIN</button>
</div>

<!-- GIFT MODAL -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mText">
  <div class="card">
  <button class="btn" id="modalClose" type="button" aria-label="Close">×</button>
  <div class="ph" id="mPhoto"></div>
  <div class="hand" id="mText"></div>
  <button class="btn" id="modalDone" type="button" style="margin-top:14px">Aww ♥</button>
</div></div>

<!-- SVG mascot (original doodle) -->
<svg width="0" height="0" style="position:absolute"><defs>
  <g id="mascot">
    <circle cx="60" cy="64" r="44" fill="#ffe2c4" stroke="#4a1d12" stroke-width="4"/>
    <path d="M60 20 C52 6 66 2 62 14 C72 4 74 16 60 22Z" fill="#4a1d12"/>
    <circle cx="44" cy="62" r="5" fill="#4a1d12"/><circle cx="76" cy="62" r="5" fill="#4a1d12"/>
    <circle cx="36" cy="76" r="7" fill="#ffb3b3" opacity=".8"/><circle cx="84" cy="76" r="7" fill="#ffb3b3" opacity=".8"/>
    <path d="M46 78 Q60 94 74 78" fill="none" stroke="#4a1d12" stroke-width="4" stroke-linecap="round"/>
    <path d="M34 48 Q44 42 54 48 M66 48 Q76 42 86 48" fill="none" stroke="#4a1d12" stroke-width="4" stroke-linecap="round"/>
  </g>
</defs></svg>

<!-- 0 LOCK -->
<section class="scene active" id="s0">
  <div class="heartframe"><svg class="mascot" viewBox="0 0 120 120"><use href="#mascot"/></svg></div>
  <div class="title">Enter a passcode</div>
  <div id="code" aria-label="Passcode entry"><i></i><i></i><i></i><i></i></div>
  <div id="passcodeStatus" role="status" aria-live="polite"></div>
  <div class="pad" id="pad" aria-label="Number pad"></div>
  <div class="hint" id="hint"></div>
</section>

<!-- 1 QUIZ -->
<section class="scene" id="s1">
  <div class="big" id="quizQ"></div>
  <svg class="mascot" viewBox="0 0 120 120" style="margin-top:12px"><use href="#mascot"/></svg>
  <div class="row"><button class="btn" id="yes1">YES</button><button class="btn" id="yes2">YES</button></div>
  <div class="hand" id="quizNote" style="margin-top:12px;min-height:1.6em"></div>
</section>

<!-- 2 HAPPY BIRTHDAY -->
<section class="scene" id="s2">
  <div class="big">HAPPY<br>BIRTHDAY<br><span id="nm"></span>!</div>
  <div class="photo-tape"><div class="ph" id="hbdPhoto"></div></div>
  <button class="btn" onclick="next()">Open the surprise →</button>
</section>

<!-- 3 GIFTS -->
<section class="scene" id="s3">
  <div class="big" style="font-size:clamp(1.8rem,8vw,3rem)">Each gift has something<br>for you…</div>
  <div class="gifts" id="gifts"></div>
  <div class="hand">CLICK 👆</div>
  <button class="btn" id="giftNext" style="display:none" onclick="next()">Next →</button>
</section>

<!-- 4 MEMORIES -->
<section class="scene" id="s4">
  <div class="big">MEMORIES</div>
  <div class="hand">tap a photo to see it bigger</div>
  <div class="line"><div class="pegs" id="pegs"></div></div>
  <button class="btn" onclick="next()">Next →</button>
</section>

<!-- 5 LETTER -->
<section class="scene" id="s5">
  <div class="big" style="font-size:clamp(1.8rem,8vw,2.8rem);margin-bottom:14px">A letter for you</div>
  <div class="paper" id="paper"></div>
  <button class="btn" onclick="next()">Next →</button>
</section>

<!-- 6 SLIDES -->
<section class="scene" id="s6">
  <div class="big" id="slideTitle" style="font-size:clamp(1.8rem,8vw,2.8rem)"></div>
  <div class="slide"><div class="ph" id="slidePhoto"></div></div>
  <div class="hand" id="slideCap" style="margin-top:8px"></div>
  <div class="nav"><button id="sp">←</button><span class="hand" id="sc"></span><button id="sn">→</button></div>
  <button class="btn" onclick="next()" style="margin-top:6px">Next →</button>
</section>

<!-- 7 COLLAGE -->
<section class="scene" id="s7">
  <div class="big" style="font-size:clamp(1.8rem,8vw,2.8rem)">THIS IS US 💕</div>
  <div class="collage" id="collage"></div>
  <button class="btn" onclick="next()">Last one →</button>
</section>

<!-- 8 FINAL -->
<section class="scene" id="s8">
  <div class="big" id="wish"></div>
  <div style="font-size:4.5rem;margin-top:14px">🎂</div>
  <button class="btn" onclick="makeWish()">Make a wish ✨</button>
</section>

<!-- 9 VIDEO SURPRISE -->
<section class="scene" id="s9">
  <div class="big" style="font-size:clamp(2rem,8vw,3.5rem)">A little something for you 💛</div>
  <video class="video-player" id="birthdayVideo" controls playsinline preload="metadata">
    <source src="1.mp4" type="video/mp4">
    Your browser does not support video playback.
  </video>
  <div class="hand" id="videoStatus" role="status" aria-live="polite">Video 1 of 4</div>
  <div class="video-nav">
    <button class="btn" id="previousVideo" type="button">← Previous</button>
    <button class="btn" id="nextVideo" type="button">Next →</button>
  </div>
  <button class="btn" onclick="restart()" style="background:linear-gradient(#777,#444);box-shadow:0 5px 0 #222">Watch again ↺</button>
</section>

<audio id="music" loop></audio>

<script>
/* =====================================================
   ✏️  EDIT THIS PART — all your personal stuff is here
   ===================================================== */
const CONFIG = {
  friendName: "Ankita (Ranu)",
  yourName:   "Dipu & Niladri",
  passcode:   "0511",              // 4 digits, e.g. her birthday as DDMM
  hint:       "Hint: your birthday (DDMM) 🎂",
  quizQuestion: "ARE YOU READY FOR YOUR SURPRISE?",

  // 📸 Put photos in a "photos" folder. Add or remove lines freely.
  birthdayPhoto: "WhatsApp Image 2026-11-02 at 07.38.26.jpeg",
  photos: [
    "WhatsApp Image 2026-11-01 at 22.23.35.jpeg",
    "WhatsApp Image 2026-11-01 at 22.22.14.jpeg",
    "WhatsApp Image 2026-11-01 at 22.22.21.jpeg",
    "WhatsApp Image 2026-11-01 at 22.22.22.jpeg",
    "WhatsApp Image 2026-11-01 at 22.22.19.jpeg",
    "WhatsApp Image 2026-11-02 at 00.57.32.jpeg",
    "WhatsApp Image 2026-11-01 at 22.23.34.jpeg",
    "WhatsApp Image 2026-11-01 at 22.19.51.jpeg",
    "WhatsApp Image 2026-11-01 at 22.22.11.jpeg"
  ],
  slideshowFirstPhoto: "WhatsApp Image 2026-11-01 at 22.23.35.jpeg",
  memoryPhotos: [
    "WhatsApp Image 2026-11-01 at 22.22.10.jpeg",
    "WhatsApp Image 2026-11-01 at 22.22.11.jpeg",
    "WhatsApp Image 2026-11-01 at 22.22.14.jpeg",
    "WhatsApp Image 2026-11-01 at 22.22.19.jpeg",
    "WhatsApp Image 2026-11-01 at 22.22.21.jpeg",
    "WhatsApp Image 2026-11-01 at 22.22.22.jpeg"
  ],

  // 🎁 Gift boxes: each opens a pop-up with a photo + message
  gifts: [
    { photo: "WhatsApp Image 2026-11-01 at 22.22.11.jpeg", text: "Gift 1: A lifetime of bad jokes only you laugh at 😂" },
    { photo: "WhatsApp Image 2026-11-01 at 22.22.14.jpeg", text: "Gift 2: Free hugs, any time, forever 🤗" },
    { photo: "WhatsApp Image 2026-11-01 at 22.22.21.jpeg", text: "Gift 3: Unlimited late-night talks 🌙" },
    { photo: "WhatsApp Image 2026-11-01 at 22.22.19.jpeg", text: "Gift 4: Me, always on your side 💖" }
  ],

  letter: [
    "Dear Ankita (Ranu),",
    "I'm so grateful to have you in my life. Thank you for being my biggest supporter and the person I can always count on.",
    "Through all the laughs, random conversations, inside jokes and even the tough days, you make my life so much better.",
    "No matter where life takes us, I hope we always stay this close and keep making memories together."
  ],

  slideTitle: "CUTIE, IN FRAME",
  captions: ["Always smiling","My partner in crime","Pure joy","Never change","Best day ever","Us, always","Forever friends","So many laughs","You, being you"],

  finalWish: "May you achieve everything you've been waiting for!",
  videos: ["1.mp4", "2.mp4", "3.mp4", "4.mp4"],
  music: ""      // optional: "music/song.mp3"
};
/* ===================================================== */

const $ = s => document.querySelector(s);
const scenes = [...document.querySelectorAll('.scene')];
let cur = 0;
const ph = (el,src,fallback='📷')=>{
  const imageUrl=encodeURI(src);
  el.style.backgroundImage = `url("${imageUrl}")`; el.textContent='';
  const t = new Image(); t.onerror=()=>{el.style.backgroundImage='none'; el.textContent=fallback;}; t.src=imageUrl;
};

function go(n){
  cur=n; scenes.forEach((s,i)=>s.classList.toggle('active',i===n));
  if(n===2) { $('#nm').textContent=CONFIG.friendName.toUpperCase(); ph($('#hbdPhoto'),CONFIG.birthdayPhoto || CONFIG.photos[0] || '','🎉'); balloons(); }
  if(n===6 && CONFIG.photos.length) showSlide(0);
  if(n===7) buildCollage();
  if(n===8){ $('#wish').textContent=CONFIG.finalWish; boom(); }
}
function next(){ if(cur<scenes.length-1) go(cur+1); }
let videoIndex=0;
let videoLoadId=0;
function playVideo(index){
  videoIndex=index;
  const video=$('#birthdayVideo');
  const loadId=++videoLoadId;
  video.pause();
  video.muted=false;
  video.volume=1;
  video.src=CONFIG.videos[videoIndex];
  video.load();
  $('#videoStatus').textContent=`Loading video ${videoIndex+1} of ${CONFIG.videos.length}…`;
  $('#previousVideo').disabled=videoIndex===0;
  $('#nextVideo').disabled=videoIndex===CONFIG.videos.length-1;
  const playback=video.play();
  if(playback) playback.then(()=>{
    if(loadId===videoLoadId) $('#videoStatus').textContent=`Video ${videoIndex+1} of ${CONFIG.videos.length}`;
  }).catch(error=>{
    if(loadId!==videoLoadId) return;
    if(error.name==='NotAllowedError') $('#videoStatus').textContent=`Video ${videoIndex+1} of ${CONFIG.videos.length} — tap play to start with sound.`;
    else $('#videoStatus').textContent=`Could not play ${CONFIG.videos[videoIndex]}: ${error.message}`;
  });
}
function makeWish(){
  boom();
  go(9);
  playVideo(0);
}

/* ---- passcode ---- */
let entered='', validating=false;
const pad=$('#pad');
['1','2','3','4','5','6','7','8','9','⌫','0','Clear'].forEach(k=>{
  const b=document.createElement('button'); b.textContent=k; b.onclick=()=>press(k); pad.appendChild(b);
});
$('#hint').textContent = CONFIG.hint;
function press(k){
  if(validating) return;
  if(/^\d$/.test(k) && entered.length<4){ entered+=k; }
  else if(k==='⌫'){ entered=entered.slice(0,-1); }
  else if(k==='Clear'){ entered=''; }
  else return;
  render();
  if(entered.length===4){
    validating=true;
    const answer=entered;
    setTimeout(()=>{
      if(answer===String(CONFIG.passcode)){ go(1); }
      else { $('#wrong').classList.add('show'); }
      entered=''; validating=false; render();
    },250);
  }
}
function render(){
  [...$('#code').children].forEach((d,i)=>d.classList.toggle('f',i<entered.length));
  $('#passcodeStatus').textContent=`${entered.length} of 4 digits entered`;
}
addEventListener('keydown',e=>{
  if(!$('#s0').classList.contains('active')) return;
  if(/^\d$/.test(e.key)) press(e.key);
  else if(e.key==='Backspace') press('⌫');
  else if(e.key==='Escape') press('Clear');
});

/* ---- quiz (both buttons are YES!) ---- */
$('#quizQ').textContent = CONFIG.quizQuestion;
const notes=['Hehe, you only get YES 😜','See? Both say YES!','Okay okay, let’s go…'];
let q=0;
['#yes1','#yes2'].forEach(id=>$(id).onclick=()=>{
  $('#quizNote').textContent=notes[Math.min(q++,2)];
  if(q>=3) setTimeout(next,700);
});

/* ---- balloons ---- */
function balloons(){
  const b=$('#balloons'); b.innerHTML='';
  for(let i=0;i<10;i++){
    const s=document.createElement('span'); s.textContent=['🎈','🎈','🎉','💛'][i%4];
    s.style.left=Math.random()*92+'vw'; s.style.animationDelay=(Math.random()*6)+'s'; s.style.animationDuration=(6+Math.random()*4)+'s';
    b.appendChild(s);
  }
}

/* ---- gifts ---- */
let opened=0, openIdx=-1;
CONFIG.gifts.forEach((g,i)=>{
  const d=document.createElement('div'); d.className='gift'; d.textContent='🎁';
  d.onclick=()=>openModal(i);
  $('#gifts').appendChild(d);
});
let giftModal=true;
function openModal(giftIndex){
  openIdx=giftIndex;
  giftModal=giftIndex>=0;
  const item=CONFIG.gifts[giftIndex];
  if(giftModal){ ph($('#mPhoto'),item.photo,'💝'); $('#mText').textContent=item.text; }
  $('#modal').classList.add('show');
  $('#modalDone').focus();
}
function closeGift(){
  $('#modal').classList.remove('show');
  if(!giftModal || openIdx<0) return;
  const d=$('#gifts').children[openIdx];
  if(!d.classList.contains('done')){ d.classList.add('done'); opened++; }
  if(opened>=CONFIG.gifts.length) $('#giftNext').style.display='inline-block';
}
$('#modalClose').onclick=closeGift;
$('#modalDone').onclick=closeGift;
$('#modal').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeGift(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#modal').classList.contains('show')) closeGift(); });

/* ---- memories (clothesline) ---- */
CONFIG.memoryPhotos.forEach(src=>{
  const p=document.createElement('div'); p.className='polaroid'; p.innerHTML='<div class="ph"></div>'; ph(p.firstChild,src,'💕');
  p.onclick=()=>{ openIdx=-1; giftModal=false; ph($('#mPhoto'),src,'💕'); $('#mText').textContent='A memory I treasure 💛'; $('#modal').classList.add('show'); $('#modalDone').focus(); };
  $('#pegs').appendChild(p);
});

/* ---- letter ---- */
$('#paper').innerHTML = CONFIG.letter.map(t=>`<p>${t}</p>`).join('')+`<p class="sig">— ${CONFIG.yourName}</p>`;

/* ---- slides ---- */
let si=0; $('#slideTitle').textContent=CONFIG.slideTitle;
function showSlide(i){
  si=i; ph($('#slidePhoto'),i===0 ? CONFIG.slideshowFirstPhoto : CONFIG.photos[i],'😍');
  $('#slideCap').textContent=CONFIG.captions[i]||'';
  $('#sc').textContent=`${i+1} / ${CONFIG.photos.length}`;
  $('#sp').disabled=i===0; $('#sn').disabled=i===CONFIG.photos.length-1;
}
$('#sp').onclick=()=>showSlide(si-1); $('#sn').onclick=()=>showSlide(si+1);

/* ---- collage ---- */
function buildCollage(){
  const c=$('#collage'); c.innerHTML='';
  const seen = new Set();
  const collageSources = [];
  const seed = [
    ...(CONFIG.slideshowFirstPhoto ? [CONFIG.slideshowFirstPhoto] : []),
    ...(CONFIG.photos || []),
    ...(CONFIG.memoryPhotos || [])
  ];

  seed.forEach(src => {
    if (!src || seen.has(src)) return;
    seen.add(src);
    collageSources.push(src);
  });

  while (collageSources.length < 9) {
    const fallback = collageSources[0] || CONFIG.memoryPhotos?.[0] || CONFIG.photos?.[0] || 'WhatsApp Image 2026-11-01 at 22.22.11.jpeg';
    if (!seen.has(fallback)) {
      seen.add(fallback);
      collageSources.push(fallback);
    } else {
      collageSources.push(fallback);
    }
  }

  collageSources.slice(0,9).forEach((src,i)=>{
    const d=document.createElement('div'); d.className='ph'; d.style.animationDelay=(i*.25)+'s'; ph(d,src,'💞'); c.appendChild(d);
  });
}

/* ---- music ---- */
const music=$('#music');
if(CONFIG.music){ music.src=CONFIG.music; $('#mute').style.display='block'; }
$('#mute').onclick=()=>{ music.muted=!music.muted; $('#mute').textContent=music.muted?'🔇':'🔊'; };
document.addEventListener('click',()=>{ if(CONFIG.music&&music.paused) music.play().catch(()=>{}); },{once:true});
$('#birthdayVideo').addEventListener('ended',()=>{
  if(videoIndex<CONFIG.videos.length-1) playVideo(videoIndex+1);
  else $('#videoStatus').textContent='You’ve watched all four videos 💛';
});
$('#birthdayVideo').addEventListener('error',()=>{
  const code=$('#birthdayVideo').error?.code;
  const cause=['','Download failed','Network error','Video format is unsupported','Video source is corrupt'][code]||'Video source could not be loaded';
  $('#videoStatus').textContent=`${cause}: ${CONFIG.videos[videoIndex]}. Keep all four videos beside index.html.`;
});
$('#previousVideo').onclick=()=>playVideo(Math.max(0,videoIndex-1));
$('#nextVideo').onclick=()=>playVideo(Math.min(CONFIG.videos.length-1,videoIndex+1));

/* ---- confetti ---- */
const cv=$('#confetti'),cx=cv.getContext('2d'); let bits=[],raf;
function size(){cv.width=innerWidth;cv.height=innerHeight} size(); addEventListener('resize',size);
function boom(){
  for(let i=0;i<160;i++) bits.push({x:innerWidth/2,y:innerHeight*.55,vx:(Math.random()-.5)*15,vy:Math.random()*-15-2,s:5+Math.random()*6,c:`hsl(${Math.random()*50+5},90%,${50+Math.random()*15}%)`,r:Math.random()*6});
  cancelAnimationFrame(raf); tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.28;b.r+=.2;cx.fillStyle=b.c;cx.save();cx.translate(b.x,b.y);cx.rotate(b.r);cx.fillRect(-b.s/2,-b.s/2,b.s,b.s*.6);cx.restore()});
  bits=bits.filter(b=>b.y<cv.height+20);
  if(bits.length) raf=requestAnimationFrame(tick);
}

function restart(){
  opened=0; q=0; $('#quizNote').textContent='';
  [...$('#gifts').children].forEach(d=>d.classList.remove('done')); $('#giftNext').style.display='none';
  $('#birthdayVideo').pause(); $('#birthdayVideo').currentTime=0; videoIndex=0;
  $('#videoStatus').textContent='Video 1 of 4';
  go(0);
}
</script>
</body>
</html>
